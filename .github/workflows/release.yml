name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (e.g. 0.1.0-preview.1, without leading v)"
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  resolve-version:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $v = '${{ github.ref_name }}'.TrimStart('v')
          } else {
            $v = '${{ inputs.version }}'.TrimStart('v')
          }
          if ([string]::IsNullOrWhiteSpace($v)) { throw 'Version is empty. Push a v* tag or pass inputs.version.' }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Output "Release version: $v"
      - name: CHANGELOG check
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $log = Get-Content CHANGELOG.md -Raw
          if ($log -notmatch [regex]::Escape($v) -and $log -notmatch 'Unreleased') {
            throw "CHANGELOG.md mentions neither $v nor Unreleased. Move Unreleased notes to a '## $v' heading before releasing."
          }

  unit:
    needs: resolve-version
    runs-on: windows-latest
    defaults:
      run:
        working-directory: csharp
    env:
      NUGET_PACKAGES: D:\a\.nuget\packages
      NUGET_HTTP_CACHE_PATH: D:\a\.nuget\v3-cache
    strategy:
      fail-fast: false
      matrix:
        tfm:
          - net8.0-windows10.0.19041.0
          - net9.0-windows10.0.19041.0
          - net10.0-windows10.0.19041.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - run: dotnet test tests/Wslc.Testcontainers.Tests/Wslc.Testcontainers.Tests.csproj -c Release -f ${{ matrix.tfm }} -v minimal -- --filter "FullyQualifiedName!~Integration"
      - run: dotnet test tests/Wslc.Testcontainers.Modules.Tests/Wslc.Testcontainers.Modules.Tests.csproj -c Release -f ${{ matrix.tfm }} -v minimal

  cpp-unit:
    needs: resolve-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache WSL Containers SDK
        uses: actions/cache@v6
        with:
          path: cpp/.packages
          key: ${{ runner.os }}-wslc-sdk-${{ hashFiles('cpp/scripts/Install-WslcSdk.ps1') }}
      - name: Fetch WSL Containers SDK
        shell: pwsh
        run: ./cpp/scripts/Install-WslcSdk.ps1 -Destination cpp/.packages
      - name: Cache GoogleTest source
        uses: actions/cache@v6
        with:
          path: cpp/build/_deps/googletest-src
          key: ${{ runner.os }}-${{ github.job }}-gtest-src-${{ hashFiles('cpp/tests/CMakeLists.txt') }}
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        shell: pwsh
        env:
          WSLC_GTEST_SOURCE_DIR: ${{ github.workspace }}/cpp/build/_deps/googletest-src
        run: cmake -S cpp -B cpp/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWSLC_SDK_ROOT="$PWD/cpp/.packages/Microsoft.WSL.Containers.3.0.1"
      - name: Build
        run: cmake --build cpp/build --parallel
      - name: Unit tests
        run: ctest --test-dir cpp/build -j 4 --output-on-failure

  guard-linux:
    needs: resolve-version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: csharp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/Wslc.Testcontainers.Tests/Wslc.Testcontainers.Tests.csproj -c Release -f net10.0-windows10.0.19041.0 -v minimal -- --filter "FullyQualifiedName~WslPlatform"

  integration:
    needs: [unit, cpp-unit, guard-linux]
    uses: ./.github/workflows/integration.yml

  publish:
    needs: [resolve-version, integration]
    runs-on: windows-latest
    defaults:
      run:
        working-directory: csharp
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      NUGET_PACKAGES: D:\a\.nuget\packages
      NUGET_HTTP_CACHE_PATH: D:\a\.nuget\v3-cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Static release checks (version lockstep, PublicAPI promotion)
        shell: pwsh
        run: ./scripts/Verify-Package.ps1 -ChecksOnly
      - run: dotnet build Wslc.Testcontainers.slnx -c Release --nologo -v minimal
      - name: Pack with tag version
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/packages | Out-Null
          dotnet pack src/Wslc.Testcontainers/Wslc.Testcontainers.csproj -c Release --no-build -o artifacts/packages /p:Version="$env:VERSION" --nologo -v minimal
          dotnet pack src/Wslc.Testcontainers.Modules.PostgreSql/Wslc.Testcontainers.Modules.PostgreSql.csproj -c Release --no-build -o artifacts/packages /p:Version="$env:VERSION" --nologo -v minimal
          dotnet pack src/Wslc.Testcontainers.Modules.Redis/Wslc.Testcontainers.Modules.Redis.csproj -c Release --no-build -o artifacts/packages /p:Version="$env:VERSION" --nologo -v minimal
          dotnet pack src/Wslc.Testcontainers.Modules.Valkey/Wslc.Testcontainers.Modules.Valkey.csproj -c Release --no-build -o artifacts/packages /p:Version="$env:VERSION" --nologo -v minimal
          dotnet pack src/Wslc.Testcontainers.Modules.MariaDb/Wslc.Testcontainers.Modules.MariaDb.csproj -c Release --no-build -o artifacts/packages /p:Version="$env:VERSION" --nologo -v minimal
          dotnet pack src/Wslc.Testcontainers.Modules.RabbitMq/Wslc.Testcontainers.Modules.RabbitMq.csproj -c Release --no-build -o artifacts/packages /p:Version="$env:VERSION" --nologo -v minimal
          dotnet pack src/Wslc.Testcontainers.Modules.MongoDb/Wslc.Testcontainers.Modules.MongoDb.csproj -c Release --no-build -o artifacts/packages /p:Version="$env:VERSION" --nologo -v minimal
          dotnet pack src/Wslc.Testcontainers.Modules.Nats/Wslc.Testcontainers.Modules.Nats.csproj -c Release --no-build -o artifacts/packages /p:Version="$env:VERSION" --nologo -v minimal
          dotnet pack src/Wslc.Testcontainers.Modules.MailPit/Wslc.Testcontainers.Modules.MailPit.csproj -c Release --no-build -o artifacts/packages /p:Version="$env:VERSION" --nologo -v minimal
          dotnet pack src/Wslc.Testcontainers.Modules.RustFs/Wslc.Testcontainers.Modules.RustFs.csproj -c Release --no-build -o artifacts/packages /p:Version="$env:VERSION" --nologo -v minimal
          dotnet pack src/Wslc.Testcontainers.Modules.Elasticsearch/Wslc.Testcontainers.Modules.Elasticsearch.csproj -c Release --no-build -o artifacts/packages /p:Version="$env:VERSION" --nologo -v minimal
          Get-ChildItem artifacts/packages
      - name: Install smoke test (local feed, outside repo)
        shell: pwsh
        run: |
          $feed = (Resolve-Path artifacts/packages).Path
          $smoke = Join-Path $env:RUNNER_TEMP 'wslc-smoke'
          if (Test-Path $smoke) { Remove-Item -Recurse -Force $smoke }
          dotnet new console -o $smoke -f net10.0 --no-restore | Out-Null
          $csproj = Get-ChildItem "$smoke/*.csproj" | Select-Object -First 1
          (Get-Content $csproj.FullName -Raw) `
            -replace '<TargetFramework>net10\.0</TargetFramework>', '<TargetFramework>net10.0-windows10.0.19041.0</TargetFramework>' `
            | Set-Content $csproj.FullName
          dotnet add $csproj.FullName package Wslc.Testcontainers --version "$env:VERSION" --source "$feed"
          dotnet build $csproj.FullName -c Release --nologo -v minimal
      # Requires a NuGet.org trusted publisher for this repo + workflow
      # (owner nicknad, repo Wslc.Testcontainers, workflow release.yml).
      # See https://learn.microsoft.com/nuget/nuget-org/trusted-publishing
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push to nuget.org (trusted publishing, OIDC)
        shell: pwsh
        env:
          PUBLISH_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          # dotnet nuget push does not expand wildcards (.NET 10), so enumerate explicitly.
          # Match extensions exactly: Win32 -Filter *.nupkg also matches *.snupkg.
          $packages = Get-ChildItem artifacts/packages -File | Where-Object { $_.Extension -eq '.nupkg' }
          $symbols = Get-ChildItem artifacts/packages -File | Where-Object { $_.Extension -eq '.snupkg' }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --api-key $env:PUBLISH_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "Failed to push $($package.Name) (exit $LASTEXITCODE)." }
          }
          foreach ($symbol in $symbols) {
            dotnet nuget push $symbol.FullName --api-key $env:PUBLISH_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "Failed to push $($symbol.Name) (exit $LASTEXITCODE)." }
          }
      - name: GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_type }}' -eq 'tag' ? '${{ github.ref_name }}' : "v$env:VERSION"
          gh release create "$tag" --title "$tag" --notes "NuGet: Wslc.Testcontainers $env:VERSION (+ service modules); C++ port in cpp/. See CHANGELOG.md." artifacts/packages/*.nupkg artifacts/packages/*.snupkg --latest=false
