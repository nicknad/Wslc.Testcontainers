name: analyze

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpp-analyzer:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-llvm
      - uses: ./.github/actions/setup-cpp-build
        with:
          build-dir: cpp/build-analyze
          configure-args: >-
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
            -DWSLC_BUILD_EXAMPLES=OFF
      - name: clang-analyzer (full project; warnings are errors)
        shell: pwsh
        run: ./cpp/scripts/Run-ClangTidy.ps1 -All -BuildDir cpp/build-analyze -ConfigFile cpp/.clang-tidy-analyzer
