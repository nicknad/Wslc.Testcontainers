name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        tfm:
          - net8.0-windows10.0.19041.0
          - net9.0-windows10.0.19041.0
          - net10.0-windows10.0.19041.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - run: dotnet build Wslc.Testcontainers.slnx -c Release --nologo -v minimal
      - run: dotnet test tests/Wslc.Testcontainers.Tests/Wslc.Testcontainers.Tests.csproj -c Release -f ${{ matrix.tfm }} --no-build --filter "FullyQualifiedName!~Integration" --nologo -v minimal

  guard-linux:
    # Proves early, actionable failure off Windows. Only WslPlatformTests run here;
    # the rest of the suite is Windows-only by design (Build() throws PlatformNotSupported).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/Wslc.Testcontainers.Tests/Wslc.Testcontainers.Tests.csproj -c Release -f net10.0-windows10.0.19041.0 --filter "FullyQualifiedName~WslPlatform" --nologo -v minimal

  unit-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Wslc.Testcontainers.slnx -c Release --nologo -v minimal
      - run: dotnet test tests/Wslc.Testcontainers.Tests/Wslc.Testcontainers.Tests.csproj -c Release -f net10.0-windows10.0.19041.0 --no-build --filter "FullyQualifiedName!~Integration" --nologo -v minimal

  packages:
    needs: [unit-windows, guard-linux]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Wslc.Testcontainers.slnx -c Release --nologo -v minimal
      - run: dotnet pack src/Wslc.Testcontainers/Wslc.Testcontainers.csproj -c Release --no-build -o artifacts/packages
      - run: dotnet pack src/Wslc.Testcontainers.Modules.PostgreSql/Wslc.Testcontainers.Modules.PostgreSql.csproj -c Release --no-build -o artifacts/packages
      - run: dotnet pack src/Wslc.Testcontainers.Modules.Redis/Wslc.Testcontainers.Modules.Redis.csproj -c Release --no-build -o artifacts/packages
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages
          if-no-files-found: error
