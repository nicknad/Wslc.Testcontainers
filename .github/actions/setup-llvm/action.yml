name: Setup LLVM
description: >-
  Provides both clang tools the gates need. clang-format is pinned to LLVM 20.1.8 so the
  formatting gate cannot drift with the runner image; clang-tidy comes from the Visual
  Studio installation in the image, whose LLVM is matched to the MSVC STL it parses.

runs:
  using: composite
  steps:
    # Formatting output is a property of the tool version, so clang-format is pinned here
    # instead of following the image's LLVM.
    - name: Cache LLVM 20.1.8 (clang-format)
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: C:\Program Files\LLVM
        key: ${{ runner.os }}-llvm-20.1.8

    - name: Ensure clang-format (LLVM 20.1.8)
      shell: pwsh
      run: |
        $llvmVersion = '20.1.8'
        $bin = 'C:\Program Files\LLVM\bin'
        $format = Join-Path $bin 'clang-format.exe'
        $current = ''
        if (Test-Path -LiteralPath $format) {
          $current = ((& $format --version) -join ' ') -replace '^.*version\s+', ''
        }
        if (-not $current.Trim().StartsWith($llvmVersion)) {
          choco install llvm --version=$llvmVersion -y --no-progress --allow-downgrade
        }
        $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        & $format --version

    # The MSVC STL refuses compilers older than the toolset that shipped it (STL1000 in
    # <yvals_core.h>); Visual Studio installs a matched LLVM, so the analyzer follows the
    # compiler instead of a download that drifts from it.
    - name: Select clang-tidy from Visual Studio
      shell: pwsh
      run: |
        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
        if (-not (Test-Path -LiteralPath $vswhere)) {
          throw "vswhere.exe was not found at '$vswhere'."
        }
        $installationPath = & $vswhere -latest -products * `
          -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
          -property installationPath | Select-Object -First 1
        $tidy = Join-Path $installationPath 'VC\Tools\Llvm\x64\bin\clang-tidy.exe'
        if (-not (Test-Path -LiteralPath $tidy)) {
          throw "clang-tidy was not found at '$tidy'. The image's Visual Studio installation no longer bundles LLVM."
        }
        "WSLC_CLANG_TIDY=$tidy" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        & $tidy --version
