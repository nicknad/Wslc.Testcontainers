name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tfms:
    # The framework list lives in csharp/Directory.Build.props (per ADR-0010). CI reads it here
    # instead of keeping a second, hand-maintained copy in the matrices below.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.enumerate.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 11.0.1xx
      - id: enumerate
        shell: bash
        run: |
          tfms=$(dotnet msbuild csharp/src/Wslc.Testcontainers/Wslc.Testcontainers.csproj -nologo -getProperty:WslcTargetFrameworks | grep -E '^net[0-9]' | tail -n 1)
          matrix=$(printf '%s' "$tfms" | tr ';' '\n' | sed 's/.*/"&"/' | paste -sd, -)
          echo "matrix=[$matrix]" >> "$GITHUB_OUTPUT"

  unit-windows:
    needs: tfms
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: csharp
    env:
      NUGET_PACKAGES: D:\a\.nuget\packages
      NUGET_HTTP_CACHE_PATH: D:\a\.nuget\v3-cache
    strategy:
      fail-fast: false
      matrix:
        tfm: ${{ fromJSON(needs.tfms.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
            11.0.1xx
      - run: dotnet build Wslc.Testcontainers.slnx -c Release --nologo -v minimal
      - run: dotnet test tests/Wslc.Testcontainers.Tests/Wslc.Testcontainers.Tests.csproj -c Release -f ${{ matrix.tfm }} --no-build -v minimal -- --filter "FullyQualifiedName!~Integration"
      - run: dotnet test tests/Wslc.Testcontainers.Modules.Tests/Wslc.Testcontainers.Modules.Tests.csproj -c Release -f ${{ matrix.tfm }} --no-build -v minimal

  guard-linux:
    # Proves early, actionable failure off Windows. Only WslPlatformTests run here;
    # the rest of the suite is Windows-only by design (Build() throws PlatformNotSupported).
    # Pinned to the current LTS image; ubuntu-latest starts migrating to Ubuntu 26 in October 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: csharp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 11.0.1xx
      - run: dotnet test tests/Wslc.Testcontainers.Tests/Wslc.Testcontainers.Tests.csproj -c Release -f net11.0-windows10.0.19041.0 -v minimal -- --filter "FullyQualifiedName~WslPlatform"

  cpp-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-cpp-build
        with:
          build-dir: cpp/build
          configure-args: -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build cpp/build --parallel
      - name: Unit tests
        run: ctest --test-dir cpp/build -j 4 --output-on-failure

  cpp-lint:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-llvm
      - name: Check formatting
        shell: pwsh
        run: |
          $files = Get-ChildItem cpp -Recurse -File -Include *.hpp,*.cpp |
            Where-Object { $_.FullName -notmatch '\\build' -and $_.FullName -notmatch '\\\.packages' }
          $failed = @()
          foreach ($file in $files) {
            & clang-format --dry-run --Werror $file.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $file.FullName }
          }
          if ($failed.Count -gt 0) {
            $failed | ForEach-Object { Write-Host "needs formatting: $_" }
            throw 'clang-format check failed'
          }
      - uses: ./.github/actions/setup-cpp-build
        with:
          build-dir: cpp/build-tidy
          configure-args: >-
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
            -DWSLC_BUILD_EXAMPLES=OFF
      - name: Resolve clang-tidy base revision
        id: base
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          $base = ''
          if ($env:EVENT_NAME -eq 'pull_request') {
            git fetch --no-tags origin $env:BASE_REF
            $base = (git merge-base "origin/$env:BASE_REF" HEAD).Trim()
          } elseif ($env:EVENT_NAME -eq 'push') {
            $base = $env:EVENT_BEFORE
            if ($base) {
              git cat-file -e "$base^{commit}" 2>$null
              if ($LASTEXITCODE -ne 0) { $base = '' }
            }
          }
          "base=$base" >> $env:GITHUB_OUTPUT
          Write-Host "clang-tidy base: $base"
          # A brand-new branch has event.before = 40 zeros; the failed cat-file above
          # leaves $LASTEXITCODE nonzero, which the actions pwsh wrapper would turn into
          # a step failure. The recovery is intentional, so claim success explicitly.
          exit 0
      - name: clang-tidy (changed files; warnings are errors)
        shell: pwsh
        env:
          TIDY_BASE: ${{ steps.base.outputs.base }}
        run: |
          $base = $env:TIDY_BASE
          if ($base) {
            ./cpp/scripts/Run-ClangTidy.ps1 -Changed -Base $base -BuildDir cpp/build-tidy
          } else {
            ./cpp/scripts/Run-ClangTidy.ps1 -All -BuildDir cpp/build-tidy
          }

  cpp-asan:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-cpp-build
        with:
          build-dir: cpp/build-asan
          configure-args: >-
            -DCMAKE_BUILD_TYPE=Release -DWSLC_BUILD_EXAMPLES=OFF
            -DWSLC_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build cpp/build-asan --target wslc_tests --parallel
      - name: Unit tests under ASan
        run: ctest --test-dir cpp/build-asan/tests -j 4 --output-on-failure

  packages:
    needs: [unit-windows, guard-linux, cpp-windows, cpp-lint, cpp-asan]
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: csharp
    env:
      NUGET_PACKAGES: D:\a\.nuget\packages
      NUGET_HTTP_CACHE_PATH: D:\a\.nuget\v3-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 11.0.1xx
      - run: dotnet build Wslc.Testcontainers.slnx -c Release --nologo -v minimal
      - name: Verify formatting
        run: dotnet format Wslc.Testcontainers.slnx --verify-no-changes --no-restore --verbosity minimal
      - name: Static release checks (version lockstep, PublicAPI promotion)
        shell: pwsh
        run: ./scripts/Verify-Package.ps1 -ChecksOnly
      - run: dotnet pack src/Wslc.Testcontainers/Wslc.Testcontainers.csproj -c Release --no-build -o artifacts/packages
      - run: dotnet pack src/Wslc.Testcontainers.Modules.PostgreSql/Wslc.Testcontainers.Modules.PostgreSql.csproj -c Release --no-build -o artifacts/packages
      - run: dotnet pack src/Wslc.Testcontainers.Modules.Redis/Wslc.Testcontainers.Modules.Redis.csproj -c Release --no-build -o artifacts/packages
      - run: dotnet pack src/Wslc.Testcontainers.Modules.Valkey/Wslc.Testcontainers.Modules.Valkey.csproj -c Release --no-build -o artifacts/packages
      - run: dotnet pack src/Wslc.Testcontainers.Modules.MariaDb/Wslc.Testcontainers.Modules.MariaDb.csproj -c Release --no-build -o artifacts/packages
      - run: dotnet pack src/Wslc.Testcontainers.Modules.SqlServer/Wslc.Testcontainers.Modules.SqlServer.csproj -c Release --no-build -o artifacts/packages
      - run: dotnet pack src/Wslc.Testcontainers.Modules.RabbitMq/Wslc.Testcontainers.Modules.RabbitMq.csproj -c Release --no-build -o artifacts/packages
      - run: dotnet pack src/Wslc.Testcontainers.Modules.MongoDb/Wslc.Testcontainers.Modules.MongoDb.csproj -c Release --no-build -o artifacts/packages
      - run: dotnet pack src/Wslc.Testcontainers.Modules.Nats/Wslc.Testcontainers.Modules.Nats.csproj -c Release --no-build -o artifacts/packages
      - run: dotnet pack src/Wslc.Testcontainers.Modules.MailPit/Wslc.Testcontainers.Modules.MailPit.csproj -c Release --no-build -o artifacts/packages
      - run: dotnet pack src/Wslc.Testcontainers.Modules.RustFs/Wslc.Testcontainers.Modules.RustFs.csproj -c Release --no-build -o artifacts/packages
      - run: dotnet pack src/Wslc.Testcontainers.Modules.WireMock/Wslc.Testcontainers.Modules.WireMock.csproj -c Release --no-build -o artifacts/packages
      - run: dotnet pack src/Wslc.Testcontainers.Modules.Qdrant/Wslc.Testcontainers.Modules.Qdrant.csproj -c Release --no-build -o artifacts/packages
      - run: dotnet pack src/Wslc.Testcontainers.Modules.ClickHouse/Wslc.Testcontainers.Modules.ClickHouse.csproj -c Release --no-build -o artifacts/packages
      - run: dotnet pack src/Wslc.Testcontainers.Modules.Vault/Wslc.Testcontainers.Modules.Vault.csproj -c Release --no-build -o artifacts/packages
      - run: dotnet pack src/Wslc.Testcontainers.Modules.Keycloak/Wslc.Testcontainers.Modules.Keycloak.csproj -c Release --no-build -o artifacts/packages
      - run: dotnet pack src/Wslc.Testcontainers.Modules.Elasticsearch/Wslc.Testcontainers.Modules.Elasticsearch.csproj -c Release --no-build -o artifacts/packages
      - run: dotnet pack src/Wslc.Testcontainers.Modules.Kafka/Wslc.Testcontainers.Modules.Kafka.csproj -c Release --no-build -o artifacts/packages
      - run: dotnet pack src/Wslc.Testcontainers.Modules.Azurite/Wslc.Testcontainers.Modules.Azurite.csproj -c Release --no-build -o artifacts/packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packages
          path: csharp/artifacts/packages
          if-no-files-found: error
