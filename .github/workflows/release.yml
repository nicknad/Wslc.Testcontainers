name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (e.g. 0.1.0-preview.1, without leading v)"
        required: true

permissions:
  contents: read

jobs:
  resolve-version:
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # Never interpolate ref/input values into the script: a tag may contain quotes.
          $raw = if ($env:REF_TYPE -eq 'tag') { $env:REF_NAME } else { $env:INPUT_VERSION }
          $v = $raw.TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($v)) { throw 'Version is empty. Push a v* tag or pass inputs.version.' }
          if ($v -notmatch '^[0-9A-Za-z][0-9A-Za-z.+-]{0,63}$') {
            throw "Version '$v' is not a valid NuGet version (letters, digits, '.', '+', '-'; max 64 chars)."
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Output "Release version: $v"
      - name: CHANGELOG check
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $v = $env:RELEASE_VERSION
          $log = Get-Content CHANGELOG.md -Raw
          if ($log -notmatch [regex]::Escape($v) -and $log -notmatch 'Unreleased') {
            throw "CHANGELOG.md mentions neither $v nor Unreleased. Move Unreleased notes to a '## $v' heading before releasing."
          }

  tfms:
    # The framework list lives in csharp/Directory.Build.props (per ADR-0010); CI reads it here
    # instead of keeping a second, hand-maintained copy in the matrix below.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.enumerate.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 11.0.1xx
      - id: enumerate
        shell: bash
        run: |
          tfms=$(dotnet msbuild csharp/src/Wslc.Testcontainers/Wslc.Testcontainers.csproj -nologo -getProperty:WslcTargetFrameworks | grep -E '^net[0-9]' | tail -n 1)
          matrix=$(printf '%s' "$tfms" | tr ';' '\n' | sed 's/.*/"&"/' | paste -sd, -)
          echo "matrix=[$matrix]" >> "$GITHUB_OUTPUT"

  unit:
    needs: [resolve-version, tfms]
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: csharp
    env:
      NUGET_PACKAGES: D:\a\.nuget\packages
      NUGET_HTTP_CACHE_PATH: D:\a\.nuget\v3-cache
    strategy:
      fail-fast: false
      matrix:
        tfm: ${{ fromJSON(needs.tfms.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
            11.0.1xx
      - run: dotnet test tests/Wslc.Testcontainers.Tests/Wslc.Testcontainers.Tests.csproj -c Release -f ${{ matrix.tfm }} -v minimal -- --filter "FullyQualifiedName!~Integration"
      - run: dotnet test tests/Wslc.Testcontainers.Modules.Tests/Wslc.Testcontainers.Modules.Tests.csproj -c Release -f ${{ matrix.tfm }} -v minimal

  cpp-unit:
    needs: resolve-version
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-cpp-build
        with:
          build-dir: cpp/build
          configure-args: -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build cpp/build --parallel
      - name: Unit tests
        run: ctest --test-dir cpp/build -j 4 --output-on-failure

  guard-linux:
    needs: resolve-version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: csharp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 11.0.1xx
      - run: dotnet test tests/Wslc.Testcontainers.Tests/Wslc.Testcontainers.Tests.csproj -c Release -f net11.0-windows10.0.19041.0 -v minimal -- --filter "FullyQualifiedName~WslPlatform"

  integration:
    needs: [unit, cpp-unit, guard-linux]
    uses: ./.github/workflows/integration.yml

  publish:
    needs: [resolve-version, integration]
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: csharp
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      NUGET_PACKAGES: D:\a\.nuget\packages
      NUGET_HTTP_CACHE_PATH: D:\a\.nuget\v3-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 11.0.1xx
      - name: Static release checks (version lockstep, PublicAPI promotion)
        shell: pwsh
        run: ./scripts/Verify-Package.ps1 -ChecksOnly
      - run: dotnet build Wslc.Testcontainers.slnx -c Release --nologo -v minimal
      - name: Pack with tag version
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/packages | Out-Null
          # Every project under src/ ships: they all set IsPackable=true and are packed for the
          # frameworks in Directory.Build.props. Packing the directory instead of a hand-kept
          # list means a new module ships without editing this workflow (per ADR-0010).
          $projects = Get-ChildItem src -Recurse -Filter *.csproj -File
          foreach ($project in $projects) {
            dotnet pack $project.FullName -c Release --no-build -o artifacts/packages /p:Version="$env:VERSION" --nologo -v minimal
            if ($LASTEXITCODE -ne 0) { throw "Failed to pack $($project.BaseName) (exit $LASTEXITCODE)." }
          }
          Get-ChildItem artifacts/packages
      - name: Install smoke test (local feed, outside repo)
        shell: pwsh
        run: |
          $feed = (Resolve-Path artifacts/packages).Path
          $smoke = Join-Path $env:RUNNER_TEMP 'wslc-smoke'
          if (Test-Path $smoke) { Remove-Item -Recurse -Force $smoke }
          # Smoke-test the newest shipped TFM (ADR-0010), read from the single framework list.
          $props = Get-Content Directory.Build.props -Raw
          if ($props -notmatch '<WslcTargetFrameworks>([^<]+)</WslcTargetFrameworks>') {
            throw 'Could not parse WslcTargetFrameworks from Directory.Build.props.'
          }
          $newest = $Matches[1].Split(';')[-1].Trim()
          $base = ($newest -split '-')[0]
          dotnet new console -o $smoke -f $base --no-restore | Out-Null
          $csproj = Get-ChildItem "$smoke/*.csproj" | Select-Object -First 1
          (Get-Content $csproj.FullName -Raw) `
            -replace [regex]::Escape("<TargetFramework>$base</TargetFramework>"), "<TargetFramework>$newest</TargetFramework>" `
            | Set-Content $csproj.FullName
          dotnet add $csproj.FullName package Wslc.Testcontainers --version "$env:VERSION" --source "$feed"
          dotnet build $csproj.FullName -c Release --nologo -v minimal
      # Requires a NuGet.org trusted publisher for this repo + workflow
      # (owner nicknad, repo Wslc.Testcontainers, workflow release.yml).
      # See https://learn.microsoft.com/nuget/nuget-org/trusted-publishing
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push to nuget.org (trusted publishing, OIDC)
        shell: pwsh
        env:
          PUBLISH_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          # dotnet nuget push does not expand wildcards (.NET 10), so enumerate explicitly.
          # Match extensions exactly: Win32 -Filter *.nupkg also matches *.snupkg.
          # --no-symbols: dotnet nuget push auto-pushes the sibling .snupkg otherwise, which
          # would race the explicit symbol loop below (duplicate 409s).
          $packages = Get-ChildItem artifacts/packages -File | Where-Object { $_.Extension -eq '.nupkg' }
          $symbols = Get-ChildItem artifacts/packages -File | Where-Object { $_.Extension -eq '.snupkg' }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --api-key $env:PUBLISH_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols
            if ($LASTEXITCODE -ne 0) { throw "Failed to push $($package.Name) (exit $LASTEXITCODE)." }
          }
          foreach ($symbol in $symbols) {
            dotnet nuget push $symbol.FullName --api-key $env:PUBLISH_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "Failed to push $($symbol.Name) (exit $LASTEXITCODE)." }
          }
      - name: GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = if ($env:REF_TYPE -eq 'tag') { $env:REF_NAME } else { "v$env:VERSION" }
          gh release create "$tag" --title "$tag" --notes "NuGet: Wslc.Testcontainers $env:VERSION (+ service modules); C++ port in cpp/. See CHANGELOG.md." artifacts/packages/*.nupkg artifacts/packages/*.snupkg --latest=false
